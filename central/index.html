<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="#" class="site-header__logo-link" aria-label="Fiesta Park Hotel">
      <img src="assets/logo-header.webp" alt="Fiesta Park Hotel logo" class="site-header__logo">
    </a>
    <nav class="site-nav" aria-label="Navegação principal">
      <a href="#" class="site-nav__link">Atrações</a>
      <a href="#" class="site-nav__link">Quem Somos</a>
      <a href="#" class="site-nav__link">Reservas</a>
      <a href="#" class="site-nav__link">Novidades</a>
      <a href="#" class="site-nav__link">Onde Estamos</a>
    </nav>
    <div class="site-header__actions">
      <a href="#" class="site-header__social" aria-label="TikTok">
        <img src="assets/tiktok.webp" alt="" class="site-header__social-icon" aria-hidden="true">
      </a>
      <a href="#" class="site-header__social" aria-label="Instagram">
        <img src="assets/instagram.webp" alt="" class="site-header__social-icon" aria-hidden="true">
      </a>
    </div>
  </header>
  <section class="exib" aria-label="Exib">
    <div class="exib__viewer">
      <div class="exib__track">
        <div class="exib__item">
          <img src="assets/planner/escorrega.webp" alt="Escorrega do parque aquático" class="exib__image">
          <span class="exib__letter">F</span>
        </div>
        <div class="exib__item">
          <img src="assets/planner/guarda-chuva.webp" alt="Área com guarda-sol do Fiesta Park" class="exib__image">
          <span class="exib__letter">I</span>
        </div>
        <div class="exib__item">
          <img src="assets/planner/baleia.webp" alt="Atração infantil em formato de baleia" class="exib__image">
          <span class="exib__letter">E</span>
        </div>
        <div class="exib__item">
          <img src="assets/planner/piscina.webp" alt="Piscina do Fiesta Park" class="exib__image">
          <span class="exib__letter">S</span>
        </div>
        <div class="exib__item">
          <img src="assets/planner/piscina2.webp" alt="Outra área de piscina do Fiesta Park" class="exib__image">
          <span class="exib__letter">T</span>
        </div>
        <div class="exib__item">
          <img src="assets/planner/quarto.webp" alt="Quarto do Fiesta Park" class="exib__image">
          <span class="exib__letter">A</span>
        </div>
      </div>
    </div>
  </section>
  <div class="section-divider" aria-hidden="true">
    <img src="assets/ingresso.webp" alt="" class="section-divider__ticket">
  </div>
  <section class="blue-panel" aria-label="Painel visual">
    <div class="blue-panel__background"></div>
  </section>
</body>
</html>
