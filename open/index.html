<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <img src="assets/fiesta-logo.webp" alt="Fiesta Park Hotel logo" class="logo">
    <div class="loading-bar" aria-label="Carregando" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="loading-bar__fill">
        <img src="assets/surfista.webp" alt="" class="loading-bar__marker" aria-hidden="true">
        <div class="loading-bar__pixels"></div>
      </div>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
